version: "3.8"

services:
  besu-node1:
    image: hyperledger/besu:25.10.0
    container_name: facebrick-besu-node1
    restart: unless-stopped
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303"
    volumes:
      - ./data/node1:/data
      - ./besu-config/genesis.json:/genesis.json
    command:
      - --genesis-file=/genesis.json
      - --data-path=/data
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-api=ETH,NET,WEB3,DEBUG,TXPOOL,ADMIN,MINER,TRACE,IBFT
      - --rpc-ws-enabled
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --rpc-ws-api=ETH,NET,WEB3,DEBUG,TXPOOL,ADMIN,IBFT
      - --host-allowlist=*
      - --min-gas-price=0
      - --miner-enabled
      - --miner-coinbase=0x90F8bf6A479f320ead074411a4B0e7944Ea8c9C1
      - --logging=INFO
      - --p2p-host=0.0.0.0
      - --p2p-port=30303
      - --discovery-enabled=true
      - --bootnodes=enode://4e243142f9aead56a0ac87ac6b0bdc4c9674f5a58cd7d46ffd4ea7817c391f9acb5c954a8d686a8b9847243541c267d45e1bd662aaf45ba2c721588ebc2c8e51@172.16.238.11:30303,enode://64dd0fc1039736999d883c6fce986f98888267db0f0bc20a6084f4422ac64635c8ed2f74ecf8a84f3f4a9fa6f9eb96f8416685f237734fd1c7fc9aedd4dcdb71@172.16.238.12:30303,enode://d2d78350d29ebdd8d0f4711166a08afad474dee7a81498b3b332d41c7b71e5be5d926aa3788806b3de96966dcdd0315ed8eaa7858faf946b7ee23e317c0f1831@172.16.238.13:30303
    networks:
      facebrick-network:
        ipv4_address: 172.16.238.10

