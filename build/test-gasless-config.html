<!DOCTYPE html>
<html>
<head>
    <title>Gasless Config Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .success { background: #d4edda; padding: 10px; margin: 10px 0; }
        .error { background: #f8d7da; padding: 10px; margin: 10px 0; }
        pre { background: #f5f5f5; padding: 10px; }
    </style>
</head>
<body>
    <h1>Gasless Transaction Configuration Test</h1>
    <div id="result"></div>
    <script>
        // Check what the build has
        const result = document.getElementById('result');

        // Check if gasless utils exist
        fetch('/static/js/main.chunk.js')
            .then(r => r.text())
            .then(code => {
                const hasGasless = code.includes('executeTransaction') || code.includes('sendMetaTransaction');
                const hasRelayer = code.includes('8549') || code.includes('localhost:8549');
                const hasForwarder = code.includes('0x36C02dA8a0983159322a80FFE9F24b1acfF8B570');

                result.innerHTML = `
                    <div class="${hasGasless && hasRelayer && hasForwarder ? 'success' : 'error'}">
                        <h2>Gasless Functions: ${hasGasless ? '✓ Found' : '✗ Not Found'}</h2>
                        <h2>Relayer URL (8549): ${hasRelayer ? '✓ Found' : '✗ Not Found'}</h2>
                        <h2>Forwarder Address: ${hasForwarder ? '✓ Found' : '✗ Not Found'}</h2>
                    </div>
                    <h3>What to do:</h3>
                    <p>1. Hard refresh your browser (Ctrl+Shift+R)</p>
                    <p>2. Open DevTools Console (F12) and check for gasless logs</p>
                    <p>3. Try buying bricks</p>
                    <p>4. You should see: "[Gasless] Executing buyBricks - Gasless mode: true"</p>
                `;
            })
            .catch(e => {
                result.innerHTML = '<div class="error">Failed to load bundle: ' + e.message + '</div>';
            });
    </script>
</body>
</html>
