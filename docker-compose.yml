  ipfs:
    image: ipfs/kubo:latest
    container_name: facebrick-ipfs
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8090:8080"
    volumes:
      - ./data/ipfs:/data/ipfs
    environment:
      - IPFS_PROFILE=server
    networks:
      - facebrick-network

networks:
  facebrick-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.238.0/24